name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt httpx==0.28.1 pytest==8.3.4
      - run: pytest backend -v

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Create simulator
        id: sim
        run: |
          UDID=""
          for device in "iPhone 16" "iPhone 15"; do
            for rt in "iOS 18.2" "iOS 18.1" "iOS 18.0" "iOS 17.5" "iOS 17.0"; do
              UDID=$(xcrun simctl create ci-iphone "$device" "$rt" 2>/dev/null) && [ -n "$UDID" ] && break 2
            done
          done
          if [ -z "$UDID" ]; then
            xcrun simctl list runtimes devicetypes
            exit 1
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - working-directory: app
        run: xcodegen generate
      - name: Unit tests (iOS Simulator)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test -project Dent.xcodeproj -scheme Dent \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
