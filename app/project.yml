name: Dent
options:
  bundleIdPrefix: com.dent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Dent:
    type: application
    platform: iOS
    sources:
      - path: Dent
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Dent
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
